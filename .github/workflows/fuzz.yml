# Weekly mutation fuzzing of the Blackbox decoder (ADR-0013). The same harness
# runs for a few seconds on every CI build (`tests/fuzz.rs`); here it gets a
# time budget and a fresh seed per run, so each week explores different inputs.
# Crashing inputs are uploaded as an artifact; the failure names the
# `OPENPID_FUZZ_REPLAY=<seed>:<iteration>` that reproduces each one.
# Every action is pinned to a full commit SHA, as in ci.yml.
name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Time budget, seconds
        default: '1200'
      seed:
        description: Seed (empty = the run id)
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

permissions:
  contents: read

jobs:
  fuzz:
    name: mutation fuzzing (blackbox decoder)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test logs from Git LFS (cached by content, pulled only when they change)
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz
      - name: Fuzz with a time budget
        env:
          OPENPID_FUZZ_SECONDS: ${{ github.event.inputs.seconds || '1200' }}
          OPENPID_FUZZ_SEED: ${{ github.event.inputs.seed || github.run_id }}
        run: |
          echo "seed $OPENPID_FUZZ_SEED, budget $OPENPID_FUZZ_SECONDS s" >> "$GITHUB_STEP_SUMMARY"
          cargo test -p openpid-fmt-blackbox --release --test fuzz -- --ignored --nocapture fuzz_long 2>&1 | tee fuzz.log
          grep '^fuzz:' fuzz.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: target/tmp/fuzz-crashes/
          if-no-files-found: ignore
