# Coverage-guided fuzzing of the decoders with cargo-fuzz / libFuzzer
# (fuzz/, ADR-0013). Every target runs weekly with a time budget, on a manual
# dispatch, and for a minute on pull requests that touch a decoder crate or
# the fuzz package. Crashing inputs are uploaded as an artifact; the failure
# names the file that reproduces them with `cargo +nightly fuzz run <target> <file>`.
# The toolchain is a dated nightly and cargo-fuzz a pinned version, bumped
# deliberately (ADR-0007). Every action is pinned to a full commit SHA, as in ci.yml.
name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Time budget per target, seconds
        default: '1200'
  pull_request:
    paths:
      - 'crates/openpid-core/**'
      - 'crates/openpid-fmt-*/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_TOOLCHAIN: nightly-2026-11-05
  CARGO_FUZZ_VERSION: 0.13.2

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [blackbox_open, blackbox_headers, ardupilot_open, csv_open]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test logs from Git LFS (cached by content, pulled only when they change)
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz-${{ matrix.target }}
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Seed corpus from the test logs
        run: sh fuzz/seed.sh
      - name: Fuzz with a time budget
        env:
          # a minute on pull requests, the input (or 20 minutes) otherwise
          BUDGET: ${{ github.event_name == 'pull_request' && '60' || github.event.inputs.seconds || '1200' }}
          DICT: ${{ startsWith(matrix.target, 'blackbox') && 'blackbox' || startsWith(matrix.target, 'ardupilot') && 'ardupilot' || 'csv' }}
        run: |
          echo "target ${{ matrix.target }}, budget $BUDGET s, dictionary $DICT" >> "$GITHUB_STEP_SUMMARY"
          cargo +${{ env.NIGHTLY_TOOLCHAIN }} fuzz run ${{ matrix.target }} -- \
            -max_total_time="$BUDGET" -timeout=10 -rss_limit_mb=2048 \
            -dict="$PWD/fuzz/dictionaries/$DICT.dict" 2>&1 | tee fuzz.log
          grep -E '^#[0-9]+ +DONE|^Done ' fuzz.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
