# Every action is pinned to a full commit SHA (the tag is in the trailing
# comment, Dependabot keeps both in sync) and every runner to a dated image:
# nothing in this pipeline changes unless a commit here changes it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0
  # Line coverage of the whole workspace below this fails the run.
  COVERAGE_MIN: 90

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- style
  check:
    name: fmt + clippy + docs + typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc (broken links and missing docs fail)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  # ---------------------------------------------------------------- commit messages (PRs only)
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit on the PR follows Conventional Commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
      - name: PR title follows Conventional Commits (used for squash merges)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false

  # ---------------------------------------------------------------- tests
  test:
    # Job names carry the platform, not the runner image, so a runner bump never
    # touches the ruleset's required checks (.github/rulesets/master.json).
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15,     name: macos }
          - { os: windows-2025, name: windows }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test logs from Git LFS (cached by content, pulled only when they change)
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  # ---------------------------------------------------------------- coverage gate
  coverage:
    name: coverage (>= 90% lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test logs from Git LFS (cached by content, pulled only when they change)
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
      - name: Measure (every crate; the GUI is tested headless, ADR-0008)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt
          {
            echo '## Coverage'
            echo '```'
            tail -n 3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate
        run: cargo llvm-cov report --fail-under-lines ${{ env.COVERAGE_MIN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # the PR summary wants the report even when the gate fails
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage.txt
          retention-days: 14

  # ---------------------------------------------------------------- dependencies
  deny:
    name: cargo deny (licences, advisories, bans)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{ env.RUST_TOOLCHAIN }}

  # ---------------------------------------------------------------- binaries for review
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux,   artifact: openpid-linux-x86_64 }
          - { os: macos-15,     name: macos,   artifact: openpid-macos-arm64 }
          - { os: windows-2025, name: windows, artifact: openpid-windows-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ matrix.os }}
      - run: cargo build --release --workspace --bins
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/openpid${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cp target/release/openpid-gui${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cp LICENSE README.md dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------- SonarCloud
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    needs: [check, coverage]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    outputs:
      ce_task_id: ${{ steps.task.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skip when SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice title=SonarCloud skipped::Add the SONAR_TOKEN repository secret to enable the analysis."
          echo '## SonarCloud: skipped (no SONAR_TOKEN secret)' >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        if: env.SONAR_TOKEN != ''
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.SONAR_TOKEN != ''
        with:
          shared-key: check
      - name: Clippy report for Sonar
        if: env.SONAR_TOKEN != ''
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json
      - name: Coverage report from the coverage job
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Remember the analysis task (the PR summary waits for it)
        id: task
        if: env.SONAR_TOKEN != ''
        run: |
          id=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- one comment on the PR: coverage + Sonar
  pr-summary:
    name: PR summary comment
    # informational only (not in CI OK); same-repo PRs, since forks get a read-only token
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [coverage, sonar]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no report when the coverage job did not get that far
        with:
          name: coverage-lcov
      - name: Build the summary
        env:
          LCOV: lcov.info
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_PROJECT: Rufics_OpenPID
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_CE_TASK_ID: ${{ needs.sonar.outputs.ce_task_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I .github/scripts/pr_summary.py > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
                --jq '[.[] | select(.body | startswith("<!-- openpid-ci-summary -->"))] | first | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@summary.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@summary.md > /dev/null
          fi

  # ---------------------------------------------------------------- single required check for the ruleset
  ci-ok:
    name: CI OK
    if: always()
    needs: [check, commits, test, coverage, deny, build, sonar]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs succeeded (skipped jobs are fine)
        run: |
          echo '${{ toJSON(needs) }}' | tee needs.json
          if grep -Eq '"result": "(failure|cancelled)"' needs.json; then
            echo 'A required job failed.' && exit 1
          fi
