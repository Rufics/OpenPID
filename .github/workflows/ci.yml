name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [check, test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate blame / new-code detection
      - name: Skip when SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN secret is not set; skipping SonarCloud analysis."
      - uses: dtolnay/rust-toolchain@master
        if: env.SONAR_TOKEN != ''
        with:
          toolchain: 1.97.0
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: env.SONAR_TOKEN != ''
      - name: Clippy report for Sonar
        if: env.SONAR_TOKEN != ''
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json
      - name: Coverage report for Sonar
        if: env.SONAR_TOKEN != ''
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
