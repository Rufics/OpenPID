# Builds and attaches binaries to the GitHub release for a tag created by release-plz.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,     archive: tar.gz }
          - { os: macos-13,       target: x86_64-apple-darwin,      archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --release --workspace --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="openpid-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/openpid$ext" "target/${{ matrix.target }}/release/openpid-gui$ext" "$name/"
          cp LICENSE README.md CHANGELOG.md "$name/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
