# Builds and attaches binaries to the GitHub release for a tag created by release-plz.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-15,     target: aarch64-apple-darwin,     archive: tar.gz }
          - { os: windows-2025, target: x86_64-pc-windows-msvc,   archive: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --release --workspace --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="openpid-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/openpid$ext" "target/${{ matrix.target }}/release/openpid-gui$ext" "$name/"
          cp LICENSE README.md CHANGELOG.md "$name/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ env.ASSET }}
