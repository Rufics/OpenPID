name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The CLI command or the steps in the GUI. Attach the log (.BBL/.BFL/.TXT/.bin) if you can share it under an MIT-compatible licence; it then becomes a fixture
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "openpid --version, OS, flight-controller firmware"
    validations:
      required: true
