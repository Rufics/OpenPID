name: Research / spike
description: An investigation whose result is a decision or an ADR
labels: ["type: research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What has to be found out, and why now
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Known options
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: An ADR, a comparison table, a prototype in a branch
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "for example, 1 day"
