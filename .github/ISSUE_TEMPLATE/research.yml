name: Research / spike
description: Дослідження, результат якого — рішення або ADR
labels: ["type: research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Питання
      description: Що треба з'ясувати і чому зараз
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Відомі варіанти
  - type: textarea
    id: outcome
    attributes:
      label: Очікуваний результат
      description: ADR, таблиця порівняння, прототип у гілці
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "наприклад, 1 день"
