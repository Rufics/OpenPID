name: Task
description: Work from the plan (feature, tech debt, tests, CI) in the Definition of Ready format
labels: ["type: feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why it is needed; links to docs/DESIGN.md, an ADR or an issue
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What exactly we do, and what we do not
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we check it is done (tests, numbers, screenshots)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, dsp, analysis, sim, gui, cli, fmt-blackbox, fmt-ardupilot, ci, docs]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
      default: 2
  - type: markdown
    attributes:
      value: |
        **Definition of Done:** a PR with green CI (fmt, clippy, tests on 3 platforms, coverage ≥ 90 %, cargo-deny, Sonar), docs/ADR updated when needed, fixtures only under an MIT-compatible licence. After creating the issue add the `area: …` and `priority: …` labels, a milestone and the Size in the Project (docs/PROCESS.md).
