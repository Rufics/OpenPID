[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz targets: a separate package on nightly with libfuzzer-sys (ADR-0015)
exclude = ["fuzz"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Rufics/OpenPID"
rust-version = "1.88"

[workspace.dependencies]
openpid-core = { path = "crates/openpid-core", version = "0.1.2" }
openpid-fmt-blackbox = { path = "crates/openpid-fmt-blackbox", version = "0.1.2" }
openpid-fmt-csv = { path = "crates/openpid-fmt-csv", version = "0.1.2" }
openpid-fmt-ardupilot = { path = "crates/openpid-fmt-ardupilot", version = "0.1.2" }
openpid-dsp = { path = "crates/openpid-dsp", version = "0.1.2" }
openpid-analysis = { path = "crates/openpid-analysis", version = "0.1.2" }
openpid-sim = { path = "crates/openpid-sim", version = "0.1.2" }
rustfft = "6.4"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_plot = "0.38"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Headless GUI tests (ADR-0008); no snapshot/wgpu features so no GPU stack is pulled in.
egui_kittest = { version = "0.37", default-features = false }

# Style rules (docs/STYLE.md) that tooling can enforce. CI runs clippy with -D warnings.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
struct_excessive_bools = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
semicolon_if_nothing_returned = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
