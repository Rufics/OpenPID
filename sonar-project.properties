# SonarQube Cloud configuration.
# The project must be imported on https://sonarcloud.io for the GitHub organization
# and the SONAR_TOKEN secret added to the repository; the "sonar" job in
# .github/workflows/ci.yml skips itself while the secret is absent.
sonar.projectKey=Rufics_OpenPID
sonar.organization=rufics
sonar.projectName=OpenPID

sonar.sources=crates
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/target/**
sonar.sourceEncoding=UTF-8

# Rust analysis inputs produced by the CI job.
sonar.rust.clippy.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
